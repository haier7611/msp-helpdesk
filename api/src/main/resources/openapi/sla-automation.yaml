openapi: 3.1.0
info:
  title: Ticket System - SLA automation rules
  version: 0.1.0
  description: |
    Admin - SLA automation. Session cookie plus the X-XSRF-TOKEN header on
    every PUT, POST and DELETE. Admins only: agents and customers get 403. No step-up. Every change
    is audit-logged (rule id and changed field names, never the note text). Errors are
    `{"error": code, "message": text}`; validation errors are 400 `invalid_request`, an unknown
    rule id 404. Rules run in `position` order when the SLA evaluation stores a state change of a
    ticket; a rule fires at most once per ticket, target and trigger. Checked against the
    registered endpoints by SlaAutomationOpenApiCoverageIntegrationTest.
servers:
  - url: /
tags:
  - name: admin-sla-automation
paths:
  /api/v1/admin/sla-automation/rules:
    get:
      tags: [admin-sla-automation]
      summary: Every rule in run order
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Rule"}}
    post:
      tags: [admin-sla-automation]
      summary: Add a rule (at the end of the run order)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleBody"}
      responses:
        "201":
          description: The new rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        "400": {description: "Invalid rule: no name, unknown trigger, no action, unknown id, note too long"}

  /api/v1/admin/sla-automation/rules/{ruleId}:
    parameters:
      - {name: ruleId, in: path, required: true, schema: {type: integer, format: int64}}
    put:
      tags: [admin-sla-automation]
      summary: Replace a rule's name, enabled flag, trigger, conditions and actions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleBody"}
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        "400": {description: Invalid rule}
        "404": {description: No such rule}
    delete:
      tags: [admin-sla-automation]
      summary: Delete a rule (its timeline lines and audit events stay)
      responses:
        "204": {description: Deleted}
        "404": {description: No such rule}

  /api/v1/admin/sla-automation/rules/{ruleId}/enabled:
    parameters:
      - {name: ruleId, in: path, required: true, schema: {type: integer, format: int64}}
    put:
      tags: [admin-sla-automation]
      summary: Turn a rule on or off (a disabled rule does nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        "404": {description: No such rule}

  /api/v1/admin/sla-automation/order:
    put:
      tags: [admin-sla-automation]
      summary: Set the run order (every rule id exactly once)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [ids], properties: {ids: {type: array, items: {type: integer, format: int64}}}}
      responses:
        "200":
          description: Rules in the new order
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Rule"}}
        "400": {description: Not every rule exactly once}

components:
  schemas:
    Trigger:
      type: string
      enum: [FIRST_RESPONSE_AT_RISK, FIRST_RESPONSE_BREACHED, FIRST_RESPONSE_MET, RESOLUTION_AT_RISK, RESOLUTION_BREACHED, RESOLUTION_MET]
      description: at risk = 80% of the target used (straight to breached counts as breached only)
    Conditions:
      type: object
      description: All optional and combined with AND; an empty list means any.
      properties:
        includeTriage: {type: boolean, description: "the \"Email triage\" choice: tickets with no organisation"}
        organisationIds: {type: array, items: {type: integer, format: int64}, maxItems: 200}
        priorities: {type: array, items: {type: string, enum: [P1, P2, P3, P4]}}
        requestTypeIds: {type: array, items: {type: integer, format: int64}, maxItems: 200}
    Action:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [NOTIFY_AGENTS, NOTIFY_ORGANISATION, ASSIGN, RAISE_PRIORITY, ADD_NOTE]}
        agentIds: {type: array, items: {type: integer, format: int64}, description: NOTIFY_AGENTS - active agents or admins}
        agentId: {type: [integer, "null"], format: int64, description: ASSIGN - an active agent or admin}
        text: {type: [string, "null"], maxLength: 1000, description: ADD_NOTE - plain text, line breaks allowed}
    RuleBody:
      type: object
      required: [name, trigger, actions]
      properties:
        name: {type: string, maxLength: 100}
        enabled: {type: boolean, description: default true}
        trigger: {$ref: "#/components/schemas/Trigger"}
        conditions: {$ref: "#/components/schemas/Conditions"}
        actions: {type: array, minItems: 1, maxItems: 10, items: {$ref: "#/components/schemas/Action"}}
    Rule:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        enabled: {type: boolean}
        position: {type: integer}
        trigger: {$ref: "#/components/schemas/Trigger"}
        conditions: {$ref: "#/components/schemas/Conditions"}
        actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
