openapi: 3.1.0
info:
  title: Ticket System - SLA, notifications and SLA report
  version: 0.1.0
  description: |
    SLA, notification and SLA report endpoints. Session cookie plus the X-XSRF-TOKEN header on
    every PUT, POST and DELETE. `/api/v1/agent` is agents and admins only, `/api/v1/admin` admins
    only (403 otherwise). SLA data is internal: none of it is reachable from `/api/v1/portal` or an
    API key. An organisation the caller may not see answers 404. Errors are
    `{"error": code, "message": text}`. Checked against the registered endpoints by
    SlaOpenApiCoverageIntegrationTest.
servers:
  - url: /
tags:
  - name: notifications
  - name: sla-report
  - name: admin-sla
paths:
  /api/v1/agent/notifications:
    get:
      tags: [notifications]
      summary: My notifications, newest first (only organisations I can still see)
      parameters:
        - {name: before, in: query, description: "id cursor", schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, default: 30, maximum: 100}}
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Notification"}
  /api/v1/agent/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Bell unread count
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: {type: object, properties: {unread: {type: integer}}}
  /api/v1/agent/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one of my notifications read (404 if not mine)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "204": {description: Marked}
        "404": {description: Not found}
  /api/v1/agent/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all my notifications read
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema: {type: object, properties: {marked: {type: integer}}}
  /api/v1/agent/sla-report:
    get:
      tags: [sla-report]
      summary: SLA report (stored values; duplicates left out of every SLA measure; triage tickets included with organisationId null unless an organisation filter is set)
      parameters: &reportParams
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, description: "inclusive, at most 400 days after from", schema: {type: string, format: date}}
        - {name: zone, in: query, description: "IANA zone for the dates; default the MSP timezone", schema: {type: string}}
        - {name: organisationId, in: query, schema: {type: integer, format: int64}}
        - {name: engineer, in: query, description: "assignee user id", schema: {type: integer, format: int64}}
        - {name: requestTypeId, in: query, schema: {type: integer, format: int64}}
        - {name: priority, in: query, schema: {type: string, enum: [P1, P2, P3, P4]}}
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SlaReport"}
        "400": {description: Invalid range or timezone}
  /api/v1/agent/sla-report/csv:
    get:
      tags: [sla-report]
      summary: The report's ticket rows as CSV (audit-logged; formula-leading cells neutralised)
      parameters: *reportParams
      responses:
        "200":
          description: CSV
          content:
            text/csv: {schema: {type: string}}
  /api/v1/admin/organisations/{id}/sla:
    get:
      tags: [admin-sla]
      summary: The organisation's timers, default assignee, business hours, holidays and SLA policies
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        "200": &orgSla
          description: Settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganisationSla"}
  /api/v1/admin/organisations/{id}/sla/timers:
    put:
      tags: [admin-sla]
      summary: Pending-on-client reminder and auto-resolve (business days), auto-close (calendar days), API alert client emails
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pendingReminderEnabled: {type: [boolean, "null"], description: "optional (the switch is edited under /api/v1/admin/organisations/{id}/client-emails); left out or null keeps the stored value"}
                pendingReminderBusinessDays: {type: integer, minimum: 1, maximum: 60}
                autoResolveEnabled: {type: boolean}
                autoResolveBusinessDays: {type: integer, minimum: 1, maximum: 120}
                autoCloseEnabled: {type: boolean}
                autoCloseCalendarDays: {type: integer, minimum: 1, maximum: 90}
                apiAlertClientEmails: {type: boolean}
      responses:
        "200": *orgSla
  /api/v1/admin/organisations/{id}/sla/default-assignee:
    put:
      tags: [admin-sla]
      summary: Organisation default assignee (active supporter with access) or null
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: &assignee
        required: true
        content:
          application/json:
            schema: {type: object, properties: {userId: {type: [integer, "null"], format: int64}}}
      responses:
        "200": *orgSla
  /api/v1/admin/organisations/{id}/sla/business-hours:
    put:
      tags: [admin-sla]
      summary: Replace the weekly business hours (1 = Monday; closes 00:00 = midnight)
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 7
              items:
                type: object
                properties:
                  dayOfWeek: {type: integer, minimum: 1, maximum: 7}
                  opens: {type: string, example: "08:30"}
                  closes: {type: string, example: "17:30"}
      responses:
        "200": *orgSla
  /api/v1/admin/organisations/{id}/sla/holidays:
    put:
      tags: [admin-sla]
      summary: Replace the holiday list
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 366
              items:
                type: object
                properties:
                  date: {type: string, format: date}
                  name: {type: string, maxLength: 100}
      responses:
        "200": *orgSla
  /api/v1/admin/organisations/{id}/sla/policies/default:
    put:
      tags: [admin-sla]
      summary: The organisation's default SLA policy (P1 must be 24/7)
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: &policy
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyRequest"}
      responses:
        "200": *orgSla
  /api/v1/admin/organisations/{id}/sla/policies/request-types/{requestTypeId}:
    put:
      tags: [admin-sla]
      summary: A request-type override of the organisation's policy
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: requestTypeId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: *policy
      responses:
        "200": *orgSla
    delete:
      tags: [admin-sla]
      summary: Remove a request-type override (the organisation default applies)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: requestTypeId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": *orgSla
  /api/v1/admin/request-types/{requestTypeId}/default-assignee:
    put:
      tags: [admin-sla]
      summary: Request-type default assignee (wins over the organisation's) or null
      parameters: [{name: requestTypeId, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: *assignee
      responses:
        "204": {description: Saved}
components:
  schemas:
    Notification:
      type: object
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [TICKET_ASSIGNED, CLIENT_REPLIED, MENTIONED, INTERNAL_NOTE_ADDED, SLA_AT_RISK, SLA_BREACHED, P1_CREATED, P1_AT_RISK, SLA_AUTOMATION]}
        detail: {type: [string, "null"], enum: [FIRST_RESPONSE, RESOLUTION, null]}
        text: {type: string}
        ticketId: {type: integer, format: int64}
        reference: {type: string}
        ticketSubject: {type: string}
        createdAt: {type: string, format: date-time}
        read: {type: boolean}
    Target:
      type: object
      properties:
        amount: {type: integer, minimum: 1}
        unit: {type: string, enum: [MINUTES, HOURS, DAYS]}
    PolicyRequest:
      type: object
      required: [targets]
      properties:
        pendingOnVendorPauses: {type: boolean, default: false}
        targets:
          type: object
          description: "Keys P1..P4, all four required"
          additionalProperties:
            type: object
            properties:
              firstResponse: {$ref: "#/components/schemas/Target"}
              resolution: {$ref: "#/components/schemas/Target"}
              clock: {type: string, enum: [TWENTY_FOUR_SEVEN, BUSINESS_HOURS]}
    OrganisationSla:
      type: object
      properties:
        organisationId: {type: integer, format: int64}
        timezone: {type: string}
        settings: {type: object}
        businessHours: {type: array, items: {type: object}}
        defaultHours: {type: boolean}
        holidays: {type: array, items: {type: object}}
        policies: {type: array, items: {type: object}}
    SlaReport:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        zone: {type: string}
        totals: {type: object, properties: {opened: {type: integer}, resolved: {type: integer}, stillOpen: {type: integer}, duplicates: {type: integer}}}
        ageing: {type: object, properties: {days0to2: {type: integer}, days3to7: {type: integer}, days8to30: {type: integer}, over30: {type: integer}}}
        firstResponse: {$ref: "#/components/schemas/MetRate"}
        resolution: {$ref: "#/components/schemas/MetRate"}
        times: {type: object, description: "businessHours (P2-P4, business minutes) and clockHours (P1, clock minutes)"}
        breached: {type: array, items: {type: object}}
        engineers: {type: array, items: {type: object}}
        tickets: {type: array, items: {type: object}}
        truncated: {type: boolean}
    MetRate:
      type: object
      properties:
        measured: {type: integer}
        met: {type: integer}
        breached: {type: integer}
        notApplicable: {type: integer}
        metPercent: {type: [number, "null"]}
