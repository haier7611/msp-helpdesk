<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail-templates/html/layout.html :: layout(~{::title}, ~{::#content})}">
<head><title th:text="|Two-step sign-in was reset on your ${supportName} account|">Two-step sign-in reset</title></head>
<body>
<div id="content">
  <p style="margin:0 0 16px;">Hello <span th:text="${recipientName}">Alex</span>,</p>
  <p style="margin:0 0 16px;">An administrator reset two-step sign-in on your <span th:text="${supportName}">Support</span> account. You have been signed out everywhere, and you will set up your authenticator app again the next time you sign in.</p>
  <p style="margin:0 0 16px;">If you did not ask for this, reset your password straight away and tell your IT team:</p>
  <p style="margin:0;font-size:13px;line-height:20px;color:#555b62;"><a th:href="${link}" th:text="${link}" href="#" style="color:#2B5797;word-break:break-all;">link</a></p>
</div>
</body>
</html>
