<!DOCTYPE html>
<!--/* Shared layout for system emails: simple tables and inline styles so it renders the same in
     Outlook (desktop and web), Gmail and phone mail apps. Every variable is escaped (th:text). */-->
<html lang="en-GB" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #dde1e6;">
          <tr>
            <td style="background-color:#2B5797;padding:16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#ffffff;" th:text="${supportName}">Support</td>
          </tr>
          <tr>
            <td style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#1f2328;">
              <div th:replace="${content}">Content</div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;border-top:1px solid #dde1e6;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#555b62;">
              This is an automatic message from <span th:text="${supportName}">Support</span>. If you were not expecting it, you can ignore it.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
