<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail-templates/html/layout.html :: layout(~{::title}, ~{::#content})}">
<head><title th:text="|Your ${supportName} account is ready to set up|">Invitation</title></head>
<body>
<div id="content">
  <p style="margin:0 0 16px;">Hello <span th:text="${recipientName}">Sam</span>,</p>
  <p style="margin:0 0 16px;"><span th:text="${supportName}">Support</span> has created an account for you at <span th:text="${organisationName}">Example Ltd</span>, so you can raise support tickets online.</p>
  <p style="margin:0 0 16px;">Use the button below to set your password.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 16px;">
    <tr>
      <td style="background-color:#2B5797;border-radius:4px;">
        <a th:href="${link}" href="#" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">Set up your account</a>
      </td>
    </tr>
  </table>
  <p style="margin:0 0 16px;">This link works once and expires in <span th:text="${validFor}">7 days</span>.</p>
  <p style="margin:0;font-size:13px;line-height:20px;color:#555b62;">If the button does not work, copy this link into your browser:<br><a th:href="${link}" th:text="${link}" href="#" style="color:#2B5797;word-break:break-all;">link</a></p>
</div>
</body>
</html>
