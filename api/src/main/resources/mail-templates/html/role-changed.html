<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail-templates/html/layout.html :: layout(~{::title}, ~{::#content})}">
<head><title th:text="|Your role on ${supportName} was changed|">Role changed</title></head>
<body>
<div id="content">
  <p style="margin:0 0 16px;">Hello <span th:text="${recipientName}">Alex</span>,</p>
  <p style="margin:0 0 16px;">An administrator changed your role on your <span th:text="${supportName}">Support</span> account. You have been signed out everywhere; sign in again to carry on.</p>
  <p style="margin:0 0 16px;">If you did not expect this, tell your IT team. You can also reset your password here:</p>
  <p style="margin:0;font-size:13px;line-height:20px;color:#555b62;"><a th:href="${link}" th:text="${link}" href="#" style="color:#2B5797;word-break:break-all;">link</a></p>
</div>
</body>
</html>
