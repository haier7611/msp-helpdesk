# Test-only settings. A synthetic, publicly known data key (not a secret) so every test context
# can start; production reads TS_DATA_KEY from the server environment (WP-02c).
app.crypto.data-key=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
app.crypto.data-key-id=test1
# WP-09: scheduled jobs are called directly by the tests (no background runs).
app.jobs.enabled=false
# WP-07: test contexts share one database; no scheduled mail polling (tests call the poller).
app.mail.inbound.auto-start=false
# ADR-039: an email's attachment job runs on the calling thread right after its mail's commit, so
# tests see the files when pollOnce() returns (same steps and transactions as the async worker).
app.mail.inbound.attachments.async=false
